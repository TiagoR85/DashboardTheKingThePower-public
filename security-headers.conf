# Seguranca: incluido pelo server e pelo location de assets (nginx nao herda
# add_header de server quando o location define um proprio).
# script-src leva 'unsafe-inline' de proposito: o Blazor .NET10 publica um
# <script type="importmap"> INLINE com os nomes fingerprintados do _framework
# (dotnet.js etc.) e o navegador recusa import maps inline sem essa keyword —
# sem ela o boot inteiro falha. Remover 'unsafe-inline' exige migrar o
# fingerprint do Blazor (fora do alcance de uma config de nginx).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
